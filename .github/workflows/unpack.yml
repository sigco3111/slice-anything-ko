name: unpack
on:
  push:
    paths:
      - '*.zip'
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the uploaded zip into the repo root
        run: |
          ZIP=$(ls -1 ./*.zip | head -n 1)
          echo "unpacking $ZIP"
          mkdir unpacked
          unzip -o "$ZIP" -d unpacked
          rsync -a --delete --exclude .git --exclude .github --exclude unpacked --exclude '*.zip' unpacked/ ./
          rm -rf unpacked ./*.zip
      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack uploaded zip" || echo "nothing to commit"
          git push
