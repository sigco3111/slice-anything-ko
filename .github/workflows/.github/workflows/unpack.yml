name: unpack
on:
  push:
    paths:
      - 'upload.zip'
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip upload.zip into the repo root
        run: |
          mkdir unpacked
          unzip -o upload.zip -d unpacked
          rsync -a --delete --exclude .git --exclude upload.zip --exclude unpacked unpacked/ ./
          rm -rf unpacked upload.zip
      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack upload.zip" || echo "nothing to commit"
          git push
